name: Validate Templates

on:
  push:
    branches: [main]
    paths:
      - angular-app/**
      - bun-api/**
      - corvid-agent-skill/**
      - deno-cli/**
      - go-cli/**
      - hello-world/**
      - mcp-server/**
      - monorepo/**
      - python-api/**
      - python-cli/**
      - rust-cli/**
      - rust-lib/**
      - rust-workspace/**
      - static-site/**
      - swift-pkg/**
      - ts-bun/**
      - ts-lib/**
      - ts-node/**
      - .github/workflows/validate.yml
  pull_request:
    branches: [main]
    paths:
      - angular-app/**
      - bun-api/**
      - corvid-agent-skill/**
      - deno-cli/**
      - go-cli/**
      - hello-world/**
      - mcp-server/**
      - monorepo/**
      - python-api/**
      - python-cli/**
      - rust-cli/**
      - rust-lib/**
      - rust-workspace/**
      - static-site/**
      - swift-pkg/**
      - ts-bun/**
      - ts-lib/**
      - ts-node/**
      - .github/workflows/validate.yml

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout templates
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache fledge build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/fledge
            ~/.cargo/registry
            ~/.cargo/git
          key: fledge-${{ hashFiles('.github/workflows/validate.yml') }}

      - name: Install fledge
        run: |
          if ! fledge templates validate --help &> /dev/null 2>&1; then
            cargo install --git https://github.com/CorvidLabs/fledge.git --branch main --force
          fi

      - name: Validate all templates
        run: |
          for dir in */; do
            if [ -f "$dir/template.toml" ]; then
              echo "Validating $dir..."
              fledge templates validate "$dir" --strict
            fi
          done
